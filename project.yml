name: BatteryWatch
options:
  bundleIdPrefix: de.lorenz-unna
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  BatteryWatch:
    type: application
    platform: macOS
    sources:
      - BatteryWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.lorenz-unna.batterywatch
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: BatteryWatch/Info.plist
      properties:
        CFBundleDisplayName: BatteryWatch
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSBluetoothAlwaysUsageDescription: BatteryWatch looks up the names of your Bluetooth keyboard, mouse and other accessories so it can show which one needs charging.
        NSHumanReadableCopyright: ""
