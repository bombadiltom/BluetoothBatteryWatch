name: BluetoothBatteryWatch
options:
  bundleIdPrefix: de.lorenz-unna
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  BluetoothBatteryWatch:
    type: application
    platform: macOS
    sources:
      - BluetoothBatteryWatch
    settings:
      base:
        # Kept from the app's original name (BatteryWatch) so settings, notification
        # permission and the login item survive the rename.
        PRODUCT_BUNDLE_IDENTIFIER: de.lorenz-unna.batterywatch
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: BluetoothBatteryWatch/Info.plist
      properties:
        CFBundleDisplayName: BluetoothBatteryWatch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSBluetoothAlwaysUsageDescription: BluetoothBatteryWatch looks up the names of your Bluetooth keyboard, mouse and other accessories so it can show which one needs charging.
        NSHumanReadableCopyright: ""
